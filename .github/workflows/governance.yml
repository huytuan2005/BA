name: BA Governance

on:
  pull_request:
  push:
    branches: [main]

jobs:
  implementation-traceability:
    name: Implementation Traceability
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run BA governance quality gate (composite)
        run: python scripts/run_governance_quality_gate.py
