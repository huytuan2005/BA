name: BA Governance

on:
  pull_request:
  push:
    branches: [main]

jobs:
  implementation-traceability:
    name: Implementation Traceability
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run implementation traceability checks
        run: python scripts/run_all_traceability.py
-----